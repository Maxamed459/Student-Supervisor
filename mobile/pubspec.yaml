name: student_supervisor_mobile
description: Student and supervisor mobile client for the Student Supervision System.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.4
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
  google_fonts: ^8.2.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo1.jpeg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo1.jpeg

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo1.jpeg
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo1.jpeg

flutter:
  uses-material-design: true
  assets:
    - assets/images/
